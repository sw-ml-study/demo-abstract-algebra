<!doctype html>
<meta charset="utf-8">
<title>The course — learn abstract algebra by breaking it</title>
<style>
  /* Same measured palette as the index: body prose 11.6:1, headings 15.4:1. */
  :root {
    --bg: #07080b; --panel: #101219; --line: #6b6f8c;
    --ink: #ffe14d; --body: #e3c34a; --good: #a9ee78; --bad: #ff8a9e;
    --soon: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px 20px 60px; background: var(--bg); color: var(--body);
    font: 15.5px/1.6 ui-monospace, Menlo, monospace;
  }
  main { max-width: 80ch; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 20px; }
  header a { color: var(--body); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--ink); }
  .where { color: var(--ink); font-size: 14px; letter-spacing: .06em; }
  h1 { font-size: 22px; color: var(--ink); margin: 0 0 12px; line-height: 1.3; }
  .prompt { margin: 0 0 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .panel h2 { font-size: 12.5px; color: var(--ink); letter-spacing: .1em;
              margin: 0 0 10px; font-weight: normal; }
  textarea {
    width: 100%; min-height: 190px; background: #04050a; color: var(--body);
    border: 1px solid var(--line); border-radius: 5px; padding: 11px;
    font: 15px/1.55 ui-monospace, Menlo, monospace; resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  button {
    background: #191c28; color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 8px 15px; font: inherit; cursor: pointer;
  }
  button:hover:enabled { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { border-color: var(--ink); font-weight: 600; }
  .row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .verdict { border-radius: 6px; padding: 12px 14px; margin-bottom: 14px;
             border: 1px solid; font-size: 15.5px; }
  .verdict.win { border-color: var(--good); color: var(--good); }
  .verdict.lose { border-color: var(--bad); color: var(--bad); }
  .witness { color: var(--body); margin-top: 7px; font-size: 14.5px; }
  .choice { display: block; width: 100%; text-align: left; margin-bottom: 7px; }
  .choice.picked { border-color: var(--ink); }
  .hint { border-left: 3px solid var(--soon); padding-left: 12px; margin: 9px 0;
          color: var(--body); }
  table.cayley { border-collapse: collapse; margin-top: 4px; }
  table.cayley th { color: var(--ink); font-weight: normal; font-size: 13.5px; padding: 3px 7px; }
  table.cayley td { width: 58px; height: 40px; text-align: center; color: #07080b;
                    font-size: 13.5px; font-weight: 600; border-radius: 4px;
                    border: 2px solid transparent; }
  table.cayley td.escaped { background: #1c1d28; color: var(--bad); font-weight: 700; }
  .dots { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 16px; }
  .dot { width: 100%; max-width: 26px; height: 7px; border-radius: 3px;
         background: #262a3a; border: none; padding: 0; cursor: pointer; }
  .dot.done { background: var(--good); }
  .dot.here { background: var(--ink); }
  .boot { color: var(--ink); }
  a { color: var(--ink); }
</style>

<main>
<header>
  <span class="where" id="where">Loading…</span>
  <span><a href="../">Home</a> &nbsp;·&nbsp; <a href="../lab/">The Lab</a></span>
</header>

<div class="dots" id="dots"></div>
<h1 id="title">…</h1>
<p class="prompt" id="prompt"></p>

<div id="work"></div>

<div class="row">
  <button class="primary" id="run" disabled>Run</button>
  <button id="hint">Hint</button>
  <button id="reveal">Show me</button>
  <button id="reset">Reset</button>
  <span class="boot" id="boot">starting the interpreter…</span>
</div>

<div id="hints"></div>
<div id="verdict"></div>

<div class="panel" id="resultPanel" hidden>
  <h2>RESULT</h2>
  <div id="grid"></div>
  <pre id="output"></pre>
</div>

<div class="row">
  <button id="prev">← Back</button>
  <button id="next" class="primary">Next →</button>
</div>
</main>

<script type="module">
import { createRuntime } from '../runtime.js';

const el = id => document.getElementById(id);
const COLORS = ['#7aa2f7', '#f7768e', '#9ece6a', '#e0af68', '#bb9af7', '#7dcfff'];

const course = await (await fetch('lessons.json')).json();
const lessons = course.lessons;

// Which lessons the reader has finished, kept per browser. Losing it costs a
// reader nothing but their place, so a failure to read it is not worth
// reporting -- render as though nothing were done.
function loadDone() {
  try { return new Set(JSON.parse(localStorage.getItem('aa-done') || '[]')); }
  catch (e) { return new Set(); }
}
function saveDone(done) {
  try { localStorage.setItem('aa-done', JSON.stringify([...done])); } catch (e) { /* fine */ }
}

let done = loadDone();
let at = Math.min(lessons.findIndex(l => !done.has(l.id)) + 0, lessons.length - 1);
if (at < 0) at = 0;
let hintsShown = 0;
let picked = null;

const mlpl = createRuntime('../mlpl/index.html');
let library = '';

// Draw a Cayley table the way the Lab does: one colour per element, and a
// value that is not an element marked rather than coloured.
function renderGrid(values, n) {
  if (!values || values.length !== n * n) return '';
  const head = Array.from({ length: n }, (_, i) => `<th>${i}</th>`).join('');
  const rows = Array.from({ length: n }, (_, r) => {
    const cells = Array.from({ length: n }, (_, c) => {
      const v = values[r * n + c];
      const inside = Number.isInteger(v) && v >= 0 && v < n;
      return inside
        ? `<td style="background:${COLORS[v % COLORS.length]}">${v}</td>`
        : `<td class="escaped">!${v}</td>`;
    }).join('');
    return `<tr><th>${r}</th>${cells}</tr>`;
  }).join('');
  return `<table class="cayley"><tr><th></th>${head}</tr>${rows}</table>`;
}

// Pull the table out of the session, if the learner made one called `t`.
function currentTable() {
  const probe = mlpl.eval('t');
  if (probe.failed) return null;
  try {
    const flat = mlpl.evalJson('to_json({n: u:order(t), v: flatten(t)})');
    return flat;
  } catch (e) { return null; }
}

function lesson() { return lessons[at]; }

function renderWork() {
  const l = lesson();
  if (l.kind === 'predict') {
    el('work').innerHTML =
      `<div class="panel"><h2>YOUR ANSWER</h2>` +
      l.choices.map((c, i) =>
        `<button class="choice" data-i="${i}">${c}</button>`).join('') +
      `</div>`;
    el('work').querySelectorAll('.choice').forEach(b => {
      b.onclick = () => {
        picked = Number(b.dataset.i);
        el('work').querySelectorAll('.choice').forEach(x => x.classList.remove('picked'));
        b.classList.add('picked');
      };
    });
  } else {
    el('work').innerHTML =
      `<div class="panel"><h2>EDIT THIS</h2><textarea id="editor" spellcheck="false"></textarea></div>`;
    el('editor').value = l.starter;
  }
}

function renderDots() {
  el('dots').innerHTML = lessons.map((l, i) =>
    `<button class="dot ${done.has(l.id) ? 'done' : ''} ${i === at ? 'here' : ''}" data-i="${i}" title="${l.title}"></button>`
  ).join('');
  el('dots').querySelectorAll('.dot').forEach(d => {
    d.onclick = () => { at = Number(d.dataset.i); show(); };
  });
}

function show() {
  const l = lesson();
  el('where').textContent = `${l.module.toUpperCase()} · ${at + 1} / ${lessons.length}`;
  el('title').textContent = l.title;
  el('prompt').textContent = l.prompt;
  el('verdict').innerHTML = '';
  el('hints').innerHTML = '';
  el('resultPanel').hidden = true;
  el('output').textContent = '';
  el('grid').innerHTML = '';
  hintsShown = 0;
  picked = null;
  el('hint').disabled = !(l.hints && l.hints.length);
  el('prev').disabled = at === 0;
  renderWork();
  renderDots();
}

function verdict(win, why, extra) {
  el('verdict').innerHTML =
    `<div class="verdict ${win ? 'win' : 'lose'}">${win ? '✓ ' : '✗ '}${why}` +
    (extra ? `<div class="witness">${extra}</div>` : '') + `</div>`;
}

async function run() {
  const l = lesson();
  el('run').disabled = true;
  // Each attempt starts from a clean environment with the library loaded, so
  // a previous lesson's definitions cannot make this one appear to pass.
  mlpl.reset();

  // A lesson may need context it did not ask the learner to type -- a
  // prediction is ABOUT a grid, but the learner is choosing, not coding.
  if (l.setup) {
    const s = mlpl.eval(l.setup);
    if (s.failed) {
      verdict(false, 'This lesson could not set itself up.', s.display.slice(0, 200));
      el('run').disabled = false;
      return;
    }
  }

  let ran;
  if (l.kind === 'predict') {
    if (picked === null) { verdict(false, 'Pick an answer first.'); el('run').disabled = false; return; }
    ran = { display: '', failed: false };
  } else {
    ran = mlpl.eval(el('editor').value);
  }

  el('resultPanel').hidden = false;
  el('output').textContent = ran.display;

  if (ran.failed) {
    verdict(false, 'That did not run.', 'Read the message below — sw-MLPL says exactly where it gave up.');
    el('run').disabled = false;
    return;
  }

  const table = currentTable();
  if (table) el('grid').innerHTML = renderGrid(table.v, table.n);

  if (!l.check) {
    pass(l, 'Run it, look at the result, and move on when you are ready.');
    el('run').disabled = false;
    return;
  }

  let v;
  try {
    v = mlpl.evalJson(l.check.replace('{{answer}}', String(picked === null ? -1 : picked)));
  } catch (e) {
    verdict(false, 'The check could not run.', String(e).slice(0, 200));
    el('run').disabled = false;
    return;
  }

  if (v.pass) {
    pass(l, v.why);
  } else {
    const w = (v.a >= 0 && v.b >= 0)
      ? `Look at row ${v.a}, column ${v.b}: it holds ${v.got}.`
      : (v.got >= 0 ? `Got ${v.got}.` : '');
    verdict(false, v.why, w);
  }
  el('run').disabled = false;
}

function pass(l, why) {
  verdict(true, why);
  done.add(l.id);
  saveDone(done);
  renderDots();
}

el('run').onclick = run;
el('hint').onclick = () => {
  const l = lesson();
  if (hintsShown >= l.hints.length) return;
  el('hints').innerHTML += `<div class="hint">${l.hints[hintsShown++]}</div>`;
  if (hintsShown >= l.hints.length) el('hint').disabled = true;
};
el('reveal').onclick = () => {
  const l = lesson();
  if (!l.solution) { el('hints').innerHTML += `<div class="hint">Nothing to solve here — just run it.</div>`; return; }
  if (l.kind === 'predict') el('hints').innerHTML += `<div class="hint">${l.solution}</div>`;
  else { el('editor').value = l.starter.includes('____') || true ? el('editor').value : ''; el('hints').innerHTML += `<div class="hint"><pre>${l.solution}</pre></div>`; }
};
el('reset').onclick = () => { renderWork(); el('verdict').innerHTML = ''; };
el('next').onclick = () => { if (at < lessons.length - 1) { at++; show(); } };
el('prev').onclick = () => { if (at > 0) { at--; show(); } };

show();
await mlpl.ready();
library = await (await fetch('algebra.mlpl')).text();
mlpl.prelude(library);
mlpl.prelude(await (await fetch('grade.mlpl')).text());
el('boot').textContent = '';
el('run').disabled = false;
</script>
